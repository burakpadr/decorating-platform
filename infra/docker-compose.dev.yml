# Local development: infrastructure only. The API runs from Maven and the web app from Vite, so
# both keep hot reload.
#
#   make infra     # starts this file
#   make dev       # starts the API and the web app against it

name: decorating-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: decorating
      POSTGRES_USER: decorating
      POSTGRES_PASSWORD: decorating
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decorating -d decorating"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # The capture flow uploads straight from the browser to MinIO, and the browser sends a preflight
      # first. Without this it fails and every upload silently does nothing. Server-level on purpose:
      # MinIO answers PutBucketCors with "not implemented", so there is no per-bucket rule to set.
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    volumes:
      - minio_dev_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/decorating-photos &&
      echo 'Bucket ready.'
      "
    restart: "no"

volumes:
  postgres_dev_data:
  minio_dev_data:
