# Single VPS deployment. Run from the repo root so the build contexts resolve:
#   docker compose -f infra/docker-compose.yml --env-file infra/.env up -d
#
# Single server is a single point of failure. That is acceptable here, but accept it deliberately:
# enable provider snapshots weekly, and set a disk alarm — the most likely failure mode is MinIO,
# Postgres WAL and container logs filling the disk at the same time.

name: decorating

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      - web
      - api
    logging: &default_logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ..
      dockerfile: web-ui/Dockerfile
    image: ${REGISTRY:-local}/decorating-web:${TAG:-latest}
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE: https://api.${DOMAIN}
    expose:
      - "3000"
    logging: *default_logging

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    image: ${REGISTRY:-local}/decorating-api:${TAG:-latest}
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: https://storage.${DOMAIN}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging: *default_logging

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default_logging

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # The capture flow uploads straight from the browser to MinIO, and the browser sends a preflight
      # first. Without PUT allowed from the web origin that upload fails and nothing can be quoted.
      # Server-level rather than per bucket: MinIO answers PutBucketCors with "not implemented", so
      # `mc cors set` cannot configure this however plausible it looks.
      MINIO_API_CORS_ALLOW_ORIGIN: https://${DOMAIN}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default_logging

  # One-shot: creates the bucket and closes it to anonymous readers. CORS is not set here — it is a
  # server setting on the minio service above, because MinIO has no per-bucket CORS to set.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      DOMAIN: ${DOMAIN}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      mc anonymous set none local/$$MINIO_BUCKET &&
      echo 'Bucket ready. Set the ILM expiry policy — see docs/engineering/deployment.md'
      "
    restart: "no"

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
