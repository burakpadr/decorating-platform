# The session secret has no default (see application.yml). Tests boot the whole context, so they need
# one; it signs nothing that leaves the JVM. AnonymousSessionCookieTest builds its own instances with
# its own secrets and does not read this.
decorating.session.secret=test-secret-long-enough-to-pass-the-floor

# The price book the suite prices against, applied on top of the shipped schema. db/fixture is test
# resources, so nothing here reaches a deployment: the migrations ship the schema and no price data
# (BOYA-72), and setup is where a real install's figures come from.
#
# FreshInstallTest does not read this. It starts its own container and runs Flyway against
# classpath:db/migration alone, because "a fresh install has no price book" has to be a claim about
# the shipped migrations — asserted against the shared database it would pass or fail on test order.
spring.flyway.locations=classpath:db/migration,classpath:db/fixture
