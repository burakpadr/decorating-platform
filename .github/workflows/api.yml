name: api

# Path filters matter here. Without them every commit rebuilds and tests both applications.
# api-client triggers this pipeline and the web one — that is intentional: a contract
# change must verify against both sides.
on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'api-client/**'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'api-client/**'
      - '.github/workflows/api.yml'

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers pulls these the moment the first test class that needs one starts, so a failed
      # pull surfaces as a ContainerFetchException two minutes into the suite — which is how it read
      # the day Docker Hub would not serve minio/minio. Pulling up front with retries turns the usual
      # flakiness (anonymous rate limits, the occasional 5xx) into a wait rather than a red build, and
      # a genuine failure into one sentence at the top of the log.
      #
      # The tags come out of the test sources rather than being repeated here. They are pinned there,
      # and a second copy is how a pre-pull ends up warming an image the suite does not use. Only the
      # repository names live in this file, and those change roughly never — a new image introduced by
      # a new test simply is not pre-pulled until its name is added here, and the suite still fetches
      # it itself.
      - name: Pre-pull the test images
        working-directory: api
        run: |
          set -euo pipefail
          # `|| true` because grep exits 1 on no match, and under `set -e` that kills the step before
          # the check below can say why.
          # Anchored on the quotes so this reads string literals and not the javadoc around them, and
          # tolerant of a registry prefix — MinIO is pulled from quay.io, not Docker Hub.
          images=$(grep -rhoE --include='*.java' \
            '"([a-z0-9.-]+/)?(minio/minio|postgres):[^"]+"' src/test/java \
            | tr -d '"' | sort -u || true)
          test -n "$images" || {
            echo "::error::no test images found — has a container declaration moved?"
            exit 1
          }
          for image in $images; do
            for attempt in 1 2 3; do
              echo "pulling $image (attempt $attempt)"
              docker pull --quiet "$image" && break
              if [ "$attempt" = 3 ]; then
                echo "::error::could not pull $image after three attempts"
                exit 1
              fi
              sleep $((attempt * 15))
            done
          done

      # Testcontainers needs a Docker daemon; ubuntu-latest ships one.
      - name: Test
        working-directory: api
        run: ./mvnw -B verify

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: api/target/surefire-reports/

  contract:
    name: contract is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Starts the app under the openapi Spring profile (no Postgres, no MinIO), fetches
      # /v3/api-docs, writes api-client/openapi.json.
      - name: Regenerate the OpenAPI spec
        working-directory: api
        run: ./mvnw -B -Popenapi verify -DskipTests

      - name: Regenerate the TypeScript client
        run: pnpm --filter @decorating/api-client generate

      # A backend DTO change that breaks the frontend fails here, in the pull request that caused
      # it, rather than at runtime.
      - name: Fail if the committed contract is stale
        run: |
          if ! git diff --exit-code -- api-client; then
            echo "::error::api-client is out of date. Run 'make client' and commit the result."
            exit 1
          fi
